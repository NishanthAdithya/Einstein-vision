# Camera intrinsics for all four cameras.
#
# Front camera values are confirmed from prior group reports (Group 6).
# Back/left/right intrinsics are placeholders — the calibration.mat files use
# MATLAB MCOS objects that cannot be parsed with scipy.io. These should be
# updated once the values are extracted (e.g., via MATLAB export or manual inspection).
#
# The Undist/ videos are already undistorted, so dist_coeffs only matter
# if processing Raw/ videos directly. All 4 cameras share the same resolution.


