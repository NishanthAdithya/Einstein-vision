# Model selection and hyperparameters.
# Change the 'model' key under each section to swap implementations.
# Available values are listed in comments.

depth:
  model: depth_anything_v2          # depth_anything_v2 | depth_pro
  model_id: depth-anything/Depth-Anything-V2-Metric-Outdoor-Large-hf
  device: cuda
  batch_size: 8

detection:
  model: yolo11                     # yolo11
  yolo11_weights: yolo11x.pt
  yolo_world_weights: yolov8x-worldv2.pt
  conf_threshold: 0.30
  iou_threshold: 0.45
  open_vocab_classes:
    - traffic cone
    - traffic cylinder
    - traffic pole
    - dustbin
    - trash can
    - waste bin
    - litter bin
    - barrel
    - stop sign
    - speed limit sign
    - circular speed limit sign
    - road sign with number
    - road arrow marking
    # Phase 3 / extra credit
    - speed bump
    - speed hump
    - raised crosswalk
    - road bump

lanes:
  model: maskrcnn                   # maskrcnn | yolopv2
  weights_path: models/maskrcnn_lane.pth
  device: cuda
  conf_threshold: 0.50
  poly_degree: 2
  bezier_points: 10

tracker:
  model: deepsort                   # deepsort | bytetrack
  max_age: 30
  n_init: 3
  max_cosine_dist: 0.4
  embedder: mobilenet

pose:
  model: yolo_pose                  # yolo_pose | rtmw
  weights: yolo11x-pose.pt          # auto-downloaded on first run
  device: cuda

flow:
  model: raft                       # raft | sea_raft
  weights: raft-things
  iters: 20
  device: cuda

vehicle_subclassifier:
  device: cuda                      # cuda | cpu

phase3:
  # Brake light / turn signal detector
  brake_history_len: 8
  brake_thresh: 0.05
  turn_thresh:  0.04

  # Motion classifier (optical flow + Sampson distance)
  flow_residual_thresh: 2.0         # pixels/frame residual to flag as moving
  sampson_thresh:       4.0         # Sampson distance to flag as moving

  # Collision predictor (extra credit)
  predict_frames:  15               # frames ahead to project (~2 s at 7.2 fps)
  warning_dist_m:  5.0              # metres — pedestrian/vehicle warning radius
